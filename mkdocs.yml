site_name: MD Farooque
site_description: Data Scientist and ML Engineer helping businesses build production-ready RAG, AI agents and machine learning systems.
site_author: MD Farooque
site_url: https://www.umarailabs.com/

nav:
  - Home:
    - About: index.md
  - Case Studies:
    - Overview: portfolio/index.md
    - Projects:
      - portfolio/projects/lead-scoring.md
      - portfolio/projects/rag-ai-tutor.md
      - portfolio/projects/search-signal-pipeline.md
      - portfolio/projects/arabic-topic-modeling.md
  - Blog:
    - blog/index.md

theme:
  name: material
  custom_dir: overrides
  features:
    - search.suggest
    - toc.integrate
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: custom
      accent: custom
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/favicon.png

extra:
  generator: true
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mdfarooque/
      name: MD Farooque on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/umarvinci
      name: MD Farooque on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:umarvinci@gmail.com
      name: Email MD Farooque
  analytics:
    # provider: google
    # property: G-XXXXXXXXXX

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0f2747"
  - blog:
      blog_dir: blog
      authors_file: "{blog}/.authors.yml"
      categories: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.keys

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js

extra_files:
  - docs/robots.txt

copyright: |
  &copy; 2026 <a href="https://www.linkedin.com/in/mdfarooque/" target="_blank" rel="noopener">MD Farooque</a>. All rights reserved.
