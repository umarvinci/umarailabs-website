  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "MD Farooque",
    "url": "{{ config.site_url }}",
    "image": "{{ config.site_url }}assets/md-farooque.jpg",
    "email": "mailto:umarvinci@gmail.com",
    "jobTitle": "Senior Data Scientist",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Delhi NCR",

    },
    "alumniOf": "MIT, Pune University",
    "knowsAbout": ["Machine Learning", "Retrieval-Augmented Generation", "LLM Evaluation", "MLOps", "MLflow", "PySpark", "Google Cloud Platform"],
    "sameAs": [
      "https://www.linkedin.com/in/mdfarooque/",
